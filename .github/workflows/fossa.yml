name: FOSSA

# A squash of an up-to-date pull request is the same tree, so this
# workflow does not run again on push to main. Monday scans the
# default branch in case a later revision is flagged.
on:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.*"
      - "fuzz/Cargo.toml"
      - "fuzz/Cargo.lock"
      - "src/**"
      - "scripts/fossa-filter.py"
      - "scripts/test_fossa_filter.py"
      - ".github/workflows/fossa.yml"
  merge_group:
  schedule:
    - cron: "15 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fossa-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fossa:
    name: FOSSA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the license filter
        run: python3 scripts/test_fossa_filter.py

      - name: Check FOSSA API key
        id: check-key
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          if [ -z "$FOSSA_API_KEY" ]; then
            echo "FOSSA_API_KEY not configured, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install FOSSA CLI
        if: steps.check-key.outputs.skip != 'true'
        env:
          FOSSA_VERSION: "3.17.10"
        run: |
          set -euo pipefail
          tarball="fossa_${FOSSA_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/fossas/fossa-cli/releases/download/v${FOSSA_VERSION}/${tarball}"
          curl -fsSL -o "${tarball}.sha256" \
            "https://github.com/fossas/fossa-cli/releases/download/v${FOSSA_VERSION}/${tarball}.sha256"
          sha256sum -c "${tarball}.sha256"
          tar xzf "$tarball" fossa
          sudo install fossa /usr/local/bin/fossa

      - name: Run FOSSA analysis
        if: steps.check-key.outputs.skip != 'true'
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          set -euo pipefail
          fossa_with_retry() {
            local out="$1"
            local err="$2"
            shift 2
            local attempt=1
            local rc=0
            while [ "$attempt" -le 3 ]; do
              set +e
              "$@" >"$out" 2>"$err"
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                return 0
              fi
              if grep -E 'status code: (429|502|503|504)' "$out" "$err"; then
                echo "FOSSA returned a transient status (attempt ${attempt})"
                if [ "$attempt" -eq 3 ]; then
                  head -c 2000 "$out"
                  head -c 2000 "$err"
                  return "$rc"
                fi
                sleep $((attempt * 15))
                attempt=$((attempt + 1))
                continue
              fi
              head -c 2000 "$out"
              head -c 2000 "$err"
              return "$rc"
            done
            return "$rc"
          }
          fossa_with_retry analyze-out.txt analyze-err.txt fossa analyze

      - name: Run FOSSA license check
        if: steps.check-key.outputs.skip != 'true'
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          set -euo pipefail
          fossa_with_retry() {
            local out="$1"
            local err="$2"
            shift 2
            local attempt=1
            local rc=0
            while [ "$attempt" -le 3 ]; do
              # Leave errexit off. Turning it back on makes a non-zero
              # return exit the step before the caller can filter.
              set +e
              "$@" >"$out" 2>"$err"
              rc=$?
              if [ "$rc" -eq 0 ]; then
                return 0
              fi
              if grep -E 'status code: (429|502|503|504)' "$out" "$err"; then
                echo "FOSSA returned a transient status (attempt ${attempt})"
                if [ "$attempt" -eq 3 ]; then
                  return "$rc"
                fi
                sleep $((attempt * 15))
                attempt=$((attempt + 1))
                continue
              fi
              return "$rc"
            done
            return "$rc"
          }
          set +e
          fossa_with_retry fossa-results.json fossa-stderr.txt fossa test --format json
          test_rc=$?
          set -e
          if [ "$test_rc" -eq 0 ]; then
            echo "FOSSA test passed with no issues."
            exit 0
          fi
          if grep -E 'status code: (429|502|503|504)' fossa-results.json fossa-stderr.txt; then
            echo "FOSSA test still returned a transient status"
            exit "$test_rc"
          fi
          echo "FOSSA test found issues. Filtering known false positives."
          head -c 2000 fossa-stderr.txt
          python3 scripts/fossa-filter.py fossa-results.json fossa-stderr.txt

  report:
    name: FOSSA report
    needs: fossa
    if: always() && github.event_name == 'schedule' && needs.fossa.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or close the FOSSA issue
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ needs.fossa.result }}
          CHECK_SIGNATURE: fossa
          CHECK_TITLE: Weekly FOSSA red
          CHECK_LEAD: Weekly FOSSA license check failed.
          CHECK_GREEN: Weekly FOSSA is green
          CHECK_SUPERSEDE: Superseded by a new weekly FOSSA failure
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          ASSIGNEE: ${{ vars.NIGHTLY_FAILURE_ASSIGNEE || 'SebTardif' }}
        run: python3 .github/scripts/weekly-deny-report.py
