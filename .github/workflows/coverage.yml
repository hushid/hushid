name: Coverage

# Coverage runs on the pull request. A squash onto main is the same
# tree, so this workflow does not run on push. Monday uploads the
# default-branch baseline.
on:
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "45 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Release pull stand-in
        if: startsWith(github.head_ref, 'release-please')
        run: echo 'Release pull. Coverage already ran on the commits in this release.'

      - name: Checkout
        if: ${{ !startsWith(github.head_ref, 'release-please') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Rust toolchain
        if: ${{ !startsWith(github.head_ref, 'release-please') }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo
        if: ${{ !startsWith(github.head_ref, 'release-please') }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Install cargo-llvm-cov
        if: ${{ !startsWith(github.head_ref, 'release-please') }}
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        if: ${{ !startsWith(github.head_ref, 'release-please') }}
        run: cargo llvm-cov --locked --cobertura --output-path coverage.xml

      - name: Record coverage
        if: ${{ !startsWith(github.head_ref, 'release-please') }}
        run: |
          python3 - << 'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()
          pct = float(root.get("line-rate", "0")) * 100
          line = f"Line coverage: {pct:.1f}%"
          print(line)
          path = os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              with open(path, "a", encoding="utf-8") as handle:
                  handle.write(line + "\n")
          PY

      - name: Upload coverage artifact
        if: ${{ !startsWith(github.head_ref, 'release-please') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload coverage to GitHub
        if: >-
          !startsWith(github.head_ref, 'release-please') &&
          (github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository))
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage.xml
          language: Rust
          label: code-coverage/rust

  report:
    name: Coverage report
    needs: coverage
    if: always() && github.event_name == 'schedule' && needs.coverage.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or close the coverage issue
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ needs.coverage.result }}
          CHECK_SIGNATURE: coverage
          CHECK_TITLE: Weekly coverage red
          CHECK_LEAD: Weekly coverage generation failed.
          CHECK_GREEN: Weekly coverage is green
          CHECK_SUPERSEDE: Superseded by a new weekly coverage failure
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          ASSIGNEE: ${{ vars.NIGHTLY_FAILURE_ASSIGNEE || 'SebTardif' }}
        run: python3 .github/scripts/weekly-deny-report.py
