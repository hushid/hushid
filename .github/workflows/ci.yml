name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Deny
        run: cargo deny check

      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_1.7.12_linux_amd64.tar.gz"
          sha="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/${archive}" \
            -o "/tmp/${archive}"
          echo "${sha}  /tmp/${archive}" | sha256sum -c -
          sudo tar -xzf "/tmp/${archive}" -C /usr/local/bin actionlint
          actionlint -version

      - name: Install zizmor
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: zizmor@1.30.0

      - name: actionlint
        run: actionlint -color

      - name: zizmor
        run: zizmor --persona=regular --min-severity=medium .github/workflows

      - name: Rust floor matches Cargo.toml
        run: grep -q '^rust-version = "1.85"$' Cargo.toml

      - name: Rust 1.85
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.85.0

      - name: Test on Rust 1.85
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/hushid-msrv
        run: cargo test --locked

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nightly toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly

      - name: Prepend nightly toolchain to PATH
        run: dirname "$(rustup which --toolchain nightly cargo)" >> "$GITHUB_PATH"

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-fuzz

      - name: Build fuzz targets
        run: cargo fuzz build --target x86_64-unknown-linux-gnu

      - name: Fuzz the token parser
        run: cargo fuzz run token --target x86_64-unknown-linux-gnu -- -max_total_time=10

      - name: Fuzz JSON restore
        run: cargo fuzz run json_restore --target x86_64-unknown-linux-gnu -- -max_total_time=10
