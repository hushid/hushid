[package]
name = "hushid"
version = "0.1.9"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
description = "Replace a recognized identifier with a typed token. The original stays in a vault."
repository = "https://github.com/hushid/hushid"
homepage = "https://hushid.github.io/hushid/"
documentation = "https://docs.rs/hushid"
readme = "README.md"
keywords = ["pii", "tokenization", "privacy", "identifier", "sensitive-data"]
categories = ["text-processing"]

[dependencies]
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4"
regex = "1"
zeroize = "1"

[features]
default = []
ner = []

[dev-dependencies]
getrandom = "0.4"

[workspace]
members = [".", "hushid-proxy"]
exclude = ["fuzz"]
resolver = "2"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
