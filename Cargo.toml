[package]
name = "hushid"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Replace recognized direct identifiers with tokens."
repository = "https://github.com/hushid/hushid"

[dependencies]
chacha20poly1305 = "0.10"
getrandom = "0.4"
regex = "1"
zeroize = "1"

[features]
default = []
ner = []

[workspace]
members = [".", "hushid-proxy"]
exclude = ["fuzz"]
resolver = "2"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
