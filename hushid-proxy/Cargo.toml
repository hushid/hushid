[package]
name = "hushid-proxy"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "OpenAI-compatible chat proxy."
repository = "https://github.com/hushid/hushid"

[features]
default = []
ner = ["hushid/ner"]

[dependencies]
hushid = { path = ".." }
ureq = { version = "2.12.1", default-features = false, features = ["native-tls"] }

[lints.rust]
unsafe_code = "forbid"
