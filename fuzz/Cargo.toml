[package]
name = "hushid-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
hushid = { path = ".." }
libfuzzer-sys = "0.4"

[[bin]]
name = "token"
path = "fuzz_targets/token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_restore"
path = "fuzz_targets/json_restore.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[workspace]
